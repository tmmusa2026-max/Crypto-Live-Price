<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #181F29;
      font-family: 'Roboto', 'Noto Sans Bengali', sans-serif;
      width: 760px;
      padding: 24px 28px 18px 28px;
      color: #FFFFFF;
      overflow: hidden;
    }
    .crypto-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 96px;
    }
    .left-section {
      display: flex;
      align-items: center;
      width: 320px;
    }
    .coin-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin-right: 18px;
      background-color: #242D3B;
      flex-shrink: 0;
      object-fit: cover;
    }
    .name-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .pair-line {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .symbol {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .quote {
      font-size: 16px;
      font-weight: 500;
      color: #848E9C;
    }
    .full-name {
      font-size: 16px;
      font-weight: 400;
      color: #848E9C;
      margin-top: 4px;
    }
    .center-section {
      text-align: right;
      flex-grow: 1;
      padding-right: 28px;
    }
    .usd-price {
      font-size: 27px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.3px;
    }
    .bdt-price {
      font-size: 17px;
      font-weight: 400;
      color: #848E9C;
      margin-top: 4px;
    }
    .badge {
      width: 140px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      flex-shrink: 0;
    }
    .badge.green {
      background-color: #0ECB81;
    }
    .badge.red {
      background-color: #F6465D;
    }
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      color: #6C7A8D;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="coin-list">
    {{ROWS}}
  </div>

  <div class="footer">
    ⏱ Auto-Refresh: 10s &nbsp;|&nbsp; 🕒 Last Updated: {{LAST_UPDATED}}
  </div>
</body>
</html>
